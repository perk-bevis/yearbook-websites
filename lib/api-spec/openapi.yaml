openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Yearbook API - Kỷ Yếu Lớp 9A THCS Vũ Lăng 2016-2019
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student profiles
  - name: gallery
    description: Photo gallery
  - name: memories
    description: Shared memories
  - name: events
    description: Class events timeline
  - name: teacher-messages
    description: Messages from teachers
  - name: frames
    description: Avatar frames
  - name: stats
    description: Aggregated stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ────── STUDENTS ──────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    put:
      operationId: updateStudent
      tags: [students]
      summary: Update a student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/{id}/frame:
    get:
      operationId: getStudentActiveFrame
      tags: [students]
      summary: Get a student's active avatar frame
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active frame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frame"
        "404":
          description: No frame set
    put:
      operationId: setStudentFrame
      tags: [students]
      summary: Set active frame for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentFrameInput"
      responses:
        "200":
          description: Frame updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  # ────── GALLERY ──────
  /gallery:
    get:
      operationId: listPhotos
      tags: [gallery]
      summary: List gallery photos
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
    post:
      operationId: createPhoto
      tags: [gallery]
      summary: Add a photo to the gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"

  /gallery/{id}:
    delete:
      operationId: deletePhoto
      tags: [gallery]
      summary: Delete a photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ────── MEMORIES ──────
  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List shared memories
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get a memory by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memory detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    put:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ────── EVENTS ──────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List class events (timeline)
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ────── TEACHER MESSAGES ──────
  /teacher-messages:
    get:
      operationId: listTeacherMessages
      tags: [teacher-messages]
      summary: List messages from teachers
      responses:
        "200":
          description: List of teacher messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherMessage"
    post:
      operationId: createTeacherMessage
      tags: [teacher-messages]
      summary: Add a teacher message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherMessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherMessage"

  /teacher-messages/{id}:
    put:
      operationId: updateTeacherMessage
      tags: [teacher-messages]
      summary: Update a teacher message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherMessageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherMessage"
    delete:
      operationId: deleteTeacherMessage
      tags: [teacher-messages]
      summary: Delete a teacher message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ────── FRAMES ──────
  /frames:
    get:
      operationId: listFrames
      tags: [frames]
      summary: List all available avatar frames
      responses:
        "200":
          description: List of frames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Frame"
    post:
      operationId: createFrame
      tags: [frames]
      summary: Create a new frame (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Frame"

  /frames/{id}/unlock:
    post:
      operationId: unlockFrame
      tags: [frames]
      summary: Unlock a premium frame for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockFrameInput"
      responses:
        "200":
          description: Frame unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockFrameResult"

  # ────── STATS (WOW) ──────
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall yearbook stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /cohorts:
    get:
      operationId: listCohorts
      tags: [friends]
      summary: List available cohorts
      responses:
        "200":
          description: Cohort filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cohort"

  /classes:
    get:
      operationId: listClasses
      tags: [friends]
      summary: List available classes
      parameters:
        - name: cohort_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Class filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"

  /users/search:
    get:
      operationId: searchUsers
      tags: [friends]
      summary: Search users visible to the current user
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: cohort_id
          in: query
          required: false
          schema:
            type: integer
        - name: class_id
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendSearchResult"

  /friends:
    get:
      operationId: getFriendsOverview
      tags: [friends]
      summary: List friends, requests, and suggestions
      responses:
        "200":
          description: Friend overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendOverview"

  /friends/request:
    post:
      operationId: requestFriendship
      tags: [friends]
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestBody"
      responses:
        "201":
          description: Request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendActionResult"

  /friends/{request_id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [friends]
      summary: Accept an incoming friend request
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendActionResult"

  /friends/{request_id}/decline:
    post:
      operationId: declineFriendRequest
      tags: [friends]
      summary: Decline an incoming friend request
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendActionResult"

  /friends/{target_id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend or cancel a request
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendActionResult"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups the current user has joined
      responses:
        "200":
          description: Joined groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreationInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/discover:
    get:
      operationId: discoverGroups
      tags: [groups]
      summary: Discover public groups
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cohort_id
          in: query
          required: false
          schema:
            type: integer
        - name: class_id
          in: query
          required: false
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Paginated public groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSearchResult"

  /groups/{group_id}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details and members
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdateBody"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group as its owner
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

  /groups/{group_id}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a public group or request private access
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

  /groups/{group_id}/posts:
    get:
      operationId: listGroupPosts
      tags: [groups]
      summary: List group posts newest first
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupPost"
    post:
      operationId: createGroupPost
      tags: [groups]
      summary: Add a text post to a group
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPostBody"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPost"

  /groups/{group_id}/members/{member_id}/invite:
    post:
      operationId: inviteGroupMember
      tags: [groups]
      summary: Invite a user to a group
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

  /groups/{group_id}/members/{member_id}/approve:
    post:
      operationId: approveGroupMember
      tags: [groups]
      summary: Approve a pending group member
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Membership approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

  /groups/{group_id}/members/{member_id}:
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove or leave a group
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Membership removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

  /groups/{group_id}/members/{member_id}/role:
    patch:
      operationId: updateGroupRole
      tags: [groups]
      summary: Change a group member role
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: integer
        - name: member_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupActionResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Cohort:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        year:
          type: integer
        school_name:
          type: string
      required: [id, name, year, school_name]

    Class:
      type: object
      properties:
        id:
          type: integer
        cohort_id:
          type: integer
        name:
          type: string
        cohort_name:
          type: string
      required: [id, cohort_id, name]

    SocialUser:
      type: object
      properties:
        clerk_user_id:
          type: string
        full_name:
          type: ["string", "null"]
        nickname:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        school_name:
          type: ["string", "null"]
        class_name:
          type: ["string", "null"]
        cohort_id:
          type: ["integer", "null"]
        class_id:
          type: ["integer", "null"]
        online:
          type: boolean
        last_seen_at:
          type: ["string", "null"]
        friend_status:
          type: string
          enum: [self, friends, outgoing, incoming, none]
        request_id:
          type: ["integer", "null"]
        mutual_count:
          type: integer
        created_at:
          type: ["string", "null"]
        sender_id:
          type: string
        target_id:
          type: string
      required: [clerk_user_id]

    FriendSearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      required: [items, total, page, page_size]

    FriendOverview:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
      required: [friends, incoming, outgoing, suggestions]

    FriendRequestBody:
      type: object
      properties:
        target_id:
          type: string
          minLength: 1
          maxLength: 255
      required: [target_id]

    FriendActionResult:
      type: object
      properties:
        status:
          type: string
          enum: [friends, outgoing, incoming, none]
        request_id:
          type: ["integer", "null"]
      required: [status]

    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        cohort_id:
          type: ["integer", "null"]
        class_id:
          type: ["integer", "null"]
        owner_id:
          type: ["string", "null"]
        privacy:
          type: string
          enum: [public, private]
        is_default:
          type: boolean
        created_at:
          type: ["string", "null"]
        member_count:
          type: integer
        my_status:
          type: ["string", "null"]
        my_role:
          type: ["string", "null"]
        cohort_name:
          type: ["string", "null"]
        class_name:
          type: ["string", "null"]
        last_message:
          type: ["string", "null"]
        last_at:
          type: ["string", "null"]
        members:
          type: array
